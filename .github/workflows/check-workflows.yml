name: Workflow validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.*'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" --directory "$tool_dir" actionlint
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Validate workflow syntax and expressions
        # Existing shell warnings are separate from workflow schema validation.
        run: actionlint -shellcheck= -pyflakes= -no-color .github/workflows/*.yml
