name: COLMAP (Mac)

concurrency:
  # Events that skip builds must not cancel an explicit run on the same PR/ref.
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{
      ((github.event.action == 'labeled' && (
        github.repository == 'colmap/colmap' ||
        (github.event.label.name != 'full-ci' &&
         (github.event.label.name != 'run-ci' ||
          contains(github.event.pull_request.labels.*.name, 'full-ci'))))) ||
       (github.repository != 'colmap/colmap' &&
        (github.event_name == 'push' || github.event_name == 'release'))) &&
      format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  release:
    types: [ published, edited ]

env:
  ORT_DISABLE_TELEMETRY: "1"

jobs:
  build:
    name: ${{ matrix.config.os }} ${{ matrix.config.arch }} ${{ matrix.config.cmakeBuildType }}
    # Fork builds are opt-in; use run-ci for the normal suite or full-ci for all jobs.
    if: >-
      (github.repository == 'colmap/colmap' && github.event.action != 'labeled') ||
      github.event_name == 'workflow_dispatch' ||
      (github.repository != 'colmap/colmap' &&
       github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.labels.*.name, 'run-ci') ||
        contains(github.event.pull_request.labels.*.name, 'full-ci')) &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'full-ci' ||
        (github.event.label.name == 'run-ci' &&
         !contains(github.event.pull_request.labels.*.name, 'full-ci'))))
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        config: [
          {
            os: macos-15,
            arch: arm64,
            cmakeBuildType: Release,
          },
        ]

    env:
      COMPILER_CACHE_DIR: ${{ github.workspace }}/compiler-cache
      CCACHE_DIR: ${{ github.workspace }}/compiler-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 100M
      GLOG_v: 2
      GLOG_logtostderr: 1

    steps:
      - uses: actions/checkout@v7

      - name: Restore compiler cache
        uses: ./.github/actions/compiler-cache
        id: cache-compiler
        with:
          mode: restore
          path: ${{ env.COMPILER_CACHE_DIR }}
          key-suffix: ${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ matrix.config.cmakeBuildType }}

      - name: Setup Mac
        run: |
          brew install \
            cmake \
            ninja \
            boost \
            eigen \
            openimageio \
            curl \
            metis \
            glog \
            googletest \
            ceres-solver \
            qt \
            glew \
            cgal \
            sqlite3 \
            ccache \
            libomp
          brew link --force libomp
          ccache --zero-stats

      - name: Configure and build
        run: |
          export PATH="/usr/local/opt/qt/bin:$PATH"
          cmake --version
          mkdir -p build
          cd build
          cmake .. \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.cmakeBuildType }} \
            -DTESTS_ENABLED=ON \
            -DWERROR_ENABLED=ON \
            -DQt6_DIR="$(brew --prefix qt)/lib/cmake/Qt6"
          ninja

      - name: Run tests
        env:
          COLMAP_TEST_HEAVY: "1"
        run: |
          cd build
          set +e
          ctest --output-on-failure

      - name: Export package
        run: |
          ./scripts/shell/build_mac_app.sh build/src/colmap/exe/colmap

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: colmap-arm64-macos
          path: build/src/colmap/exe/COLMAP-mac.zip

      - name: Cleanup compiler cache
        run: |
          set -x
          ccache --cleanup
          ccache --show-stats --verbose

      - name: Save compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          mode: save
          key: ${{ steps.cache-compiler.outputs.key }}
          path: ${{ env.COMPILER_CACHE_DIR }}
          cache-hit: ${{ steps.cache-compiler.outputs.cache-hit }}
